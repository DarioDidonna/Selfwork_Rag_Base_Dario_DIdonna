[tool.poetry]
name = "selfwork-rag-base"
version = "0.1.0"
description = "Esercizio Selfwork RAG Base con lettura file e chunking"
authors = ["Dario Didonna"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
chainlit = "^2.0.0"
openai = "^1.0.0"
chromadb = "^0.5.0"
python-dotenv = "^1.0.0"
langchain-text-splitters = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
